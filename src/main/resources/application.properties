# Servidor: http://localhost:8080
server.port=8080

# ===== CONEXION A MYSQL =====
# Cambie la clave si su MySQL tiene una (XAMPP normalmente es vacia)
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Crea/actualiza las tablas automaticamente a partir de las clases del paquete model
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=false

# ===== SEGURIDAD =====
# La sesión se cierra sola después de 15 minutos sin uso
server.servlet.session.timeout=15m
# La cookie de sesión no se puede leer desde JavaScript
server.servlet.session.cookie.http-only=true
