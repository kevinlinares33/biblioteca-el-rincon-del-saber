<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>El Rincón del Saber - Ingresar</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="fondo">
<form class="caja" th:action="@{/login}" method="post">
    <h1>📚 El Rincón del Saber</h1>
    <p class="sub">Sistema de libros y préstamos</p>
    <p class="error" th:if="${error}" th:text="${error}"></p>
    <p class="ok" th:if="${ok}" th:text="${ok}"></p>
    <input type="text" name="usuario" placeholder="Usuario" required>
    <input type="password" name="clave" placeholder="Contraseña" required>
    <button type="submit">Ingresar</button>
    <a th:href="@{/registro}">¿No tiene cuenta? Regístrese</a>
</form>
</body>
</html>
